services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            NODE_ENV: production
            HOST: 0.0.0.0
            PORT: 3000
        ports:
            - '3000:3000'
        volumes:
            - mirthgraph-config:/app/config
        restart: unless-stopped

volumes:
    mirthgraph-config:
